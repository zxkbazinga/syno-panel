name: Publish Syno Panel image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: publish-syno-panel-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Calculate semantic version
        id: version
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          latest_tag="$(git for-each-ref \
            --format='%(refname:short)' \
            --sort=-version:refname refs/tags |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
            head -n 1 || true)"

          if [ -z "$latest_tag" ]; then
            release_tag="v0.1.0"
          else
            bump=1
            while IFS= read -r commit; do
              subject="$(git show -s --format=%s "$commit")"
              body="$(git show -s --format=%b "$commit")"
              if printf '%s\n' "$subject" | grep -Eq '^((feat|fix|perf)(\([^)]*\))?!:)'; then
                bump=3
              elif printf '%s\n' "$body" | grep -q '^BREAKING CHANGE:'; then
                bump=3
              elif printf '%s\n' "$subject" | grep -Eq '^feat(\([^)]*\))?:' && [ "$bump" -lt 2 ]; then
                bump=2
              fi
            done < <(git rev-list "$latest_tag..HEAD")

            version="${latest_tag#v}"
            IFS=. read -r major minor patch <<< "$version"
            case "$bump" in
              3) major=$((major + 1)); minor=0; patch=0 ;;
              2) minor=$((minor + 1)); patch=0 ;;
              1) patch=$((patch + 1)) ;;
            esac
            release_tag="v${major}.${minor}.${patch}"
          fi

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "image_version=$release_tag" >> "$GITHUB_OUTPUT"
          echo "Next release: $release_tag"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push amd64 image
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          IMAGE_VERSION: ${{ steps.version.outputs.image_version }}
        run: |
          image="$REGISTRY/$IMAGE_NAME"
          docker build \
            --platform linux/amd64 \
            --build-arg "APP_VERSION=$IMAGE_VERSION" \
            --tag "$image:$RELEASE_TAG" \
            --tag "$image:latest" \
            .
          docker push "$image:$RELEASE_TAG"
          docker push "$image:latest"
          git tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "Release $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"
