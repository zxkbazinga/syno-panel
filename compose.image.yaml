services:
  nas-panel:
    image: "${NAS_PANEL_IMAGE:-nas-panel:latest}"
    container_name: nas-panel
    restart: unless-stopped
    ports:
      - "5666:5666"
    environment:
      PORT: "5666"
      DOCKER_SOCKET: /var/run/docker.sock
      HOST_ROOT: /host
      HOST_PROC: /host/proc
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /volume1:/host/volume1:ro
      - /volume2:/host/volume2:ro
      - /proc:/host/proc:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
